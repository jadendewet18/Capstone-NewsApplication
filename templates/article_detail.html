{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h1 class="card-title">{{ article.title }}</h1>
        <p class="text-muted">
            By <strong>{{ article.author.username }}</strong>
            {% if article.publisher %} | Publisher: {{ article.publisher.name }}{% endif %}
            | {{ article.created_at|date:"F j, Y, g:i a" }}
        </p>
        <hr>
        <p class="card-text lead" style="white-space: pre-line;">{{ article.content }}</p>
        <a href="{% url 'home' %}" class="btn btn-secondary mt-3">&larr; Back to News</a>
    </div>
</div>
{% endblock %}
