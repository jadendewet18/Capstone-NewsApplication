version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: news_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: news_db
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_in_env}  
    
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: news_django_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
    depends_on:
      - db

volumes:
  mysql_data: