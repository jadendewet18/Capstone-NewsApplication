{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-4 text-center">
            <i class="bi bi-exclamation-triangle text-danger display-4 mb-3"></i>
            <h3 class="fw-bold mb-2">Delete Newsletter?</h3>
            <p class="text-muted mb-4">Are you sure you want to delete <strong>"{{ newsletter.title }}"</strong>? This action cannot be undone.</p>
            
            <form method="post" class="d-flex justify-content-center gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger rounded-pill fw-bold px-4">Confirm Delete</button>
                <a href="{% url 'newsletter_list' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
