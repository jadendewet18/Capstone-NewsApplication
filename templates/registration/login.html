{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 fw-bold text-primary">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </h3>

                {% if form.errors %}
                    <div class="alert alert-danger py-2 small" role="alert">
                        Invalid username or password. Please try again.
                    </div>
                {% endif %}

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" id="id_username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" id="id_password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2 mt-2">
                        Login
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

<p class="text-center mt-3 text-muted small">
    Don't have an account? <a href="{% url 'register' %}">Sign up here</a>
</p>
