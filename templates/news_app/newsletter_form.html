{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold mb-3">{{ title }}</h3>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Newsletter Title</label>
                    {{ form.title }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    {{ form.description }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Select Articles</label>
                    {{ form.articles }}
                </div>
                <button type="submit" class="btn btn-primary rounded-pill fw-bold w-100">Save Newsletter</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
